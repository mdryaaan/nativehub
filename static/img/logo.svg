<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="NativeHub logo">
  <defs>
    <linearGradient id="nh-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bbcaa"/>
      <stop offset="1" stop-color="#0b665e"/>
    </linearGradient>
  </defs>
  <!-- Hexagon shell: a nod to the container/CNCF visual language -->
  <path d="M24 2.6 43.4 13.8v22.4L24 47.4 4.6 36.2V13.8Z" fill="url(#nh-g)"/>
  <path d="M24 2.6 43.4 13.8v22.4L24 47.4 4.6 36.2V13.8Z" fill="none" stroke="#032725" stroke-opacity=".18" stroke-width="1.4"/>
  <!-- Three stacked layers = an image's filesystem layers -->
  <g fill="#eafaf7">
    <rect x="15" y="14" width="18" height="4.6" rx="1.4" opacity=".55"/>
    <rect x="15" y="21.7" width="18" height="4.6" rx="1.4" opacity=".8"/>
    <rect x="15" y="29.4" width="18" height="4.6" rx="1.4"/>
  </g>
